<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Family Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,600&amp;display=swap">
<style>
/* Written for the old Kindle WebKit: no flexbox, no grid, no gap. Tables only.
   Sizes are for a 758px-wide layout; the script zooms the page to the real screen width. */
html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body { font-family: 'Nunito Sans', 'Avenir Next', 'Avenir', 'Helvetica Neue', 'STHeiti', 'Noto Sans SC', sans-serif; -webkit-text-size-adjust: none; }
#hub { padding: 30px 44px 30px; }
table { border-collapse: collapse; width: 100%; }
td { padding: 0; vertical-align: top; }
.small { font-size: 18px; letter-spacing: 2px; }
.label { font-size: 17px; letter-spacing: 3px; color: #222; }
.rule { height: 0; border-top: 2px solid #000; margin: 30px 0 28px; }
#tabs td { font-size: 32px; padding: 6px 34px 14px 0; color: #555; white-space: nowrap; }
#tabs td.on { color: #000; font-weight: 600; }
#tabs td.on span { border-bottom: 4px solid #000; padding-bottom: 6px; }
.meta { text-align: right; vertical-align: middle; }
#date { font-size: 26px; letter-spacing: 1px; font-weight: 600; margin-right: 10px; }
#idleDate { font-size: 24px; letter-spacing: 1px; }
.lang a { color: #555; text-decoration: none; margin-left: 18px; font-size: 20px; padding: 10px 4px; }
.lang a.on { color: #000; font-weight: 600; border-bottom: 3px solid #000; }
.temp { font-size: 136px; font-weight: 300; line-height: 120px; letter-spacing: -4px; }
.wx { font-size: 23px; margin-top: 12px; }
.wear { text-align: right; font-size: 28px; font-weight: 600; line-height: 42px; }
.kidname { font-size: 32px; font-weight: 600; }
.kidtime { font-size: 40px; font-weight: 300; margin-top: 8px; }
.kidact { font-size: 22px; font-weight: 600; margin-top: 10px; line-height: 32px; }
.kidcls { font-size: 21px; line-height: 33px; margin-top: 8px; }
.ride { font-size: 27px; padding: 12px 0; }
.ride .who { text-align: right; font-weight: 600; }
.home { display: inline-block; margin-top: 18px; border: 2px solid #000; padding: 16px 26px; font-size: 24px; color: #000; text-decoration: none; }
.home.on { background: #000; color: #fff; }
.inv { background: #000; color: #fff; padding: 4px 14px; }
.blk { background: #000; color: #fff; padding: 6px 24px; margin-top: 12px; }
.blk td { font-size: 30px; padding: 14px 0; }
.row td { font-size: 27px; padding: 14px 0; border-bottom: 2px solid #000; }
.row2 td { font-size: 23px; padding: 11px 0; }
.r { text-align: right; }
.est { font-size: 18px; margin-left: 8px; }
.sum { font-size: 23px; margin: 8px 0 4px; }
.note { background: #000; color: #fff; padding: 18px 24px; margin-top: 14px; font-size: 31px; font-weight: 600; line-height: 42px; }
.note .by { font-size: 20px; font-weight: 400; margin-left: 12px; }
#idleNotes { position: absolute; left: 44px; right: 110px; bottom: 40px; }
#idle { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #fff center center no-repeat; -webkit-background-size: cover; background-size: cover; }
#idleClock { position: absolute; left: 44px; top: 48px; }
#idleTime { font-size: 64px; font-weight: 300; }
#logo { position: absolute; right: 44px; bottom: 44px; height: 36px; }
#err { font-size: 18px; color: #000; }
</style>
</head>
<body>
<div id="hub">
  <table><tr>
    <td><table id="tabs" style="width:auto"><tr>
      <td id="tab-family" onclick="showTab('family')"></td>
      <td id="tab-fridge" onclick="showTab('fridge')"></td>
    </tr></table></td>
    <td class="meta"><span id="date"></span><span class="lang" id="lang"></span></td>
  </tr></table>
  <div id="err"></div>
  <div id="notes"></div>
  <div id="view-family"></div>
  <div id="view-fridge" style="display:none"></div>
</div>
<div id="idle" onclick="wake()">
  <div id="idleClock"><div id="idleTime"></div><div id="idleDate"></div></div>
  <div id="idleNotes"></div>
  <img id="logo" src="logo.png" alt="">
</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="gallery/list.js"></script>
<script>
// The key can arrive as #k=KEY or ?k=KEY (old Kindle browsers may drop the # part on redirects)
var token = ((location.hash + '&' + location.search).match(/k=([0-9a-z]+)/) || [])[1] || '';
// Remember the key, so a plain bookmark of kindle.html keeps working
try { if (token) localStorage.setItem('hubToken', token); else token = localStorage.getItem('hubToken') || ''; } catch (e) {}
var lang = 'zh', langLocked = false, tab = 'family', data = null, weather = null;
var lastTouch = new Date().getTime(), idle = false, galleryIdx = Math.floor(Math.random() * 1000);
try { var saved = localStorage.getItem('hubLang'); if (saved) { lang = saved; langLocked = true; } } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function $(id) { return document.getElementById(id); }
// E-ink saves power when nothing redraws: only touch the DOM when the content really changed
var shown = {};
function setProp(id, k, v) { if ($(id)[k] !== v) $(id)[k] = v; }
function setDisplay(id, v) { if ($(id).style.display !== v) $(id).style.display = v; }
function put(id, html) { if (shown[id] !== html) { shown[id] = html; $(id).innerHTML = html; } }

function xhr(method, url, body, cb) {
  var x = new XMLHttpRequest();
  x.open(method, url, true);
  if (body) {
    x.setRequestHeader('Content-Type', 'application/json');
    x.setRequestHeader('apikey', HUB_CONFIG.supabaseKey);
  }
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300) { try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); } }
    else cb(new Error('HTTP ' + x.status));
  };
  x.send(body ? JSON.stringify(body) : null);
}

function load() {
  if (!token) { askKey(); return; }
  xhr('POST', HUB_CONFIG.supabaseUrl + '/rest/v1/rpc/hub_get', { p_token: token }, function (err, res) {
    if (err) { put('err', '· offline ·'); return; }
    put('err', '');
    data = res;
    if (!langLocked && res.settings && res.settings.lang) lang = res.settings.lang;
    render();
  });
  xhr('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + HUB_CONFIG.lat + '&longitude=' + HUB_CONFIG.lon +
    '&current=temperature_2m,weather_code&daily=temperature_2m_min,temperature_2m_max,weather_code,precipitation_probability_max' +
    '&timezone=Europe%2FStockholm&forecast_days=2', null, function (err, res) {
      if (!err) { weather = res; render(); }
    });
}

function checkin(id) {
  xhr('POST', HUB_CONFIG.supabaseUrl + '/rest/v1/rpc/hub_checkin_toggle', { p_token: token, p_member: id }, function () { load(); });
}

// First run without a key: type it once, it is remembered on this Kindle
function askKey() {
  put('err', '<div style="padding:60px 0 30px;font-size:24px">家庭钥匙 · Family key</div>' +
    '<input id="keyIn" type="text" autocapitalize="off" autocorrect="off" style="font-size:28px;width:70%;padding:12px;border:2px solid #000">' +
    ' <a href="javascript:saveKey()" style="font-size:24px;padding:14px 22px;background:#000;color:#fff;text-decoration:none">OK</a>');
}
function saveKey() {
  var v = ($('keyIn').value || '').replace(/[^0-9a-zA-Z]/g, '').toLowerCase();
  if (v.length < 10) return;
  token = v; try { localStorage.setItem('hubToken', v); } catch (e) {}
  put('err', ''); load();
}

function setLang(l) { lang = l; langLocked = true; try { localStorage.setItem('hubLang', l); } catch (e) {} render(); }
function showTab(name) { tab = name; render(); }

function render() {
  var now = new Date(), L = I18N[lang];
  put('date', esc(L.date(now)));
  var codes = [['zh', '中'], ['en', 'EN'], ['sv', 'SV']], h = '';
  for (var i = 0; i < codes.length; i++)
    h += '<a href="javascript:setLang(\'' + codes[i][0] + '\')"' + (codes[i][0] === lang ? ' class="on"' : '') + '>' + codes[i][1] + '</a>';
  put('lang', h);
  put('tab-family', '<span>' + L.family + '</span>'); put('tab-fridge', '<span>' + L.fridge + '</span>');
  setProp('tab-family', 'className', tab === 'family' ? 'on' : '');
  setProp('tab-fridge', 'className', tab === 'fridge' ? 'on' : '');
  setDisplay('view-family', tab === 'family' ? 'block' : 'none');
  setDisplay('view-fridge', tab === 'fridge' ? 'block' : 'none');
  renderNotes();
  if (tab === 'family') renderFamily(now, L); else renderFridge(L);
  renderIdleClock(now, L);
}

// Parents' notes: big black boxes on every screen; tapping one marks it done
function renderNotes() {
  var h = '', hi = '', list = (data && data.notes) || [], n = 0;
  for (var i = 0; i < list.length && n < 3; i++) {
    if (list[i].done) continue; n++;
    var box = esc(list[i].text) + (list[i].author ? '<span class="by">— ' + esc(list[i].author) + '</span>' : '');
    h += '<div class="note" onclick="noteDone(\'' + list[i].id + '\')">' + box + '</div>';
    hi += '<div class="note">' + box + '</div>';
  }
  put('notes', h ? '<div style="margin-top:22px">' + h + '</div>' : '');
  put('idleNotes', hi);
}
function noteDone(id) {
  xhr('POST', HUB_CONFIG.supabaseUrl + '/rest/v1/rpc/hub_note_done', { p_token: token, p_id: id, p_done: true }, function () { load(); });
}

// After 17:00 the family tab looks ahead to tomorrow
function targetDay(now) {
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var ahead = now.getHours() >= 17;
  if (ahead) d.setDate(d.getDate() + 1);
  return { date: d, ahead: ahead };
}

function renderFamily(now, L) {
  var td = targetDay(now), idx = td.ahead ? 1 : 0, h = '';
  // Weather
  var temp = '–', wxLine = '', wear = [];
  if (weather) {
    var dly = weather.daily, low = dly.temperature_2m_min[idx], high = dly.temperature_2m_max[idx];
    var grp = wxGroup(td.ahead ? dly.weather_code[1] : weather.current.weather_code);
    temp = Math.round(td.ahead ? high : weather.current.temperature_2m) + '°';
    wxLine = (td.ahead ? L.tomorrowLabel + ' · ' : '') + L.wx[grp] + ' · Stockholm · ' + L.low + ' ' + Math.round(low) + '°';
    wear = clothes(lang, low, grp, dly.precipitation_probability_max[idx] || 0);
  }
  h += '<table style="margin-top:36px"><tr><td><div class="temp">' + temp + '</div><div class="wx">' + esc(wxLine) + '</div></td>';
  h += '<td style="width:46%" class="r"><div class="label">' + (td.ahead ? L.wearTomorrow : L.wear) + '</div>';
  h += '<div class="wear" style="margin-top:8px">' + esc(wear.join('\n')).replace(/\n/g, '<br>') + '</div></td></tr></table>';
  h += '<div class="rule"></div>';

  if (data) {
    // Kids' schedules
    var kids = [], wd = (td.date.getDay() + 6) % 7 + 1;
    for (var i = 0; i < data.members.length; i++) if (data.members[i].role === 'kid') kids.push(data.members[i]);
    h += '<table><tr>';
    for (var k = 0; k < kids.length; k++) {
      var s = null;
      for (var j = 0; j < data.schedule.length; j++)
        if (data.schedule[j].member_id === kids[k].id && data.schedule[j].weekday === wd) s = data.schedule[j];
      h += '<td style="width:' + Math.floor(100 / kids.length) + '%;' + (k > 0 ? 'padding-left:40px' : '') + '">';
      h += '<div class="kidname">' + esc(kids[k].name) + '</div>';
      if (s && (s.start_time || s.end_time)) {
        h += '<div class="kidtime">' + (s.start_time || '').substr(0, 5) + ' – ' + (s.end_time || '').substr(0, 5) + '</div>';
        h += '<div class="kidcls">' + esc(trSubjects(lang, s.classes)).replace(/\n/g, '<br>') + '</div>';
      } else {
        h += '<div class="kidtime">' + L.noSchool + '</div>';
      }
      if (s && s.activity) h += '<div class="kidact">' + L.after + ' · ' + esc(s.activity).replace(/\n/g, '<br>') + '</div>';
      var ci = null;
      for (var z = 0; z < (data.checkins || []).length; z++) if (data.checkins[z].member_id === kids[k].id) ci = data.checkins[z];
      h += '<a class="home' + (ci ? ' on' : '') + '" href="javascript:checkin(\'' + kids[k].id + '\')">' +
        (ci ? t(lang, 'homeAt', { t: ci.time }) : L.homeBtn) + '</a>';
      h += '</td>';
    }
    h += '</tr></table><div class="rule"></div>';

    // Drop-off / pick-up
    var day = ymd(td.date), rides = { dropoff: null, pickup: null };
    for (var r = 0; r < data.duties.length; r++) if (data.duties[r].day === day) rides[data.duties[r].kind] = data.duties[r];
    h += '<div class="label">' + (td.ahead ? L.ridesTomorrow : L.rides) + '</div><table style="margin-top:8px">';
    var kinds = ['dropoff', 'pickup'];
    for (var q = 0; q < 2; q++) {
      var row = rides[kinds[q]], def = data.settings[kinds[q] === 'dropoff' ? 'default_dropoff' : 'default_pickup'];
      var who = row && row.person ? row.person : (def || '–'), note = row && row.note ? row.note : '';
      h += '<tr class="ride"><td class="ride">' + L[kinds[q]] + '</td><td class="ride who">' +
        (note ? '<span class="inv">' + esc(who) + ' · ' + esc(note) + '</span>' : esc(who)) + '</td></tr>';
    }
    h += '</table>';
  }
  put('view-family', h);
}

function renderFridge(L) {
  if (!data) { put('view-fridge', ''); return; }
  var today = data.today, urgent = [], soon = [], later = [];
  for (var i = 0; i < data.fridge.length; i++) {
    var f = data.fridge[i], n = daysBetween(today, f.expires);
    f._n = n;
    if (n <= 1) urgent.push(f); else if (n <= 3) soon.push(f); else later.push(f);
  }
  function when(f) {
    var s;
    if (f._n < 0) s = t(lang, 'expired', { n: -f._n });
    else if (f._n === 0) s = L.today;
    else if (f._n === 1) s = L.tomorrow;
    else if (f._n <= 3) s = t(lang, 'days', { n: f._n });
    else s = f.expires.substr(5, 2) + '/' + f.expires.substr(8, 2);
    return s + (f.estimated && f._n <= 3 ? '<span class="est">· ' + L.est + '</span>' : '');
  }
  var h = '<div class="sum" style="margin-top:34px">' +
    (data.fridge.length ? t(lang, 'count', { n: data.fridge.length, m: urgent.length + soon.length }) : L.fridgeEmpty) + '</div>';
  if (urgent.length) {
    h += '<div class="label" style="margin-top:30px">' + L.urgent + '</div><div class="blk"><table>';
    for (var a = 0; a < Math.min(urgent.length, 4); a++)
      h += '<tr><td><b>' + esc(trFood(lang, urgent[a])) + '</b></td><td class="r">' + when(urgent[a]) + '</td></tr>';
    if (urgent.length > 4) h += '<tr><td colspan="2">' + t(lang, 'more', { n: urgent.length - 4 }) + '</td></tr>';
    h += '</table></div>';
  }
  if (soon.length) {
    h += '<div class="label" style="margin-top:36px">' + L.soon + '</div><table>';
    for (var b = 0; b < Math.min(soon.length, 4); b++)
      h += '<tr class="row"><td><b>' + esc(trFood(lang, soon[b])) + '</b></td><td class="r">' + when(soon[b]) + '</td></tr>';
    h += '</table>';
  }
  if (later.length) {
    var max = Math.min(later.length, 8), half = Math.ceil(max / 2);
    h += '<div class="label" style="margin-top:36px">' + L.later + '</div><table><tr>';
    for (var col = 0; col < 2; col++) {
      h += '<td style="width:50%;' + (col ? 'padding-left:24px' : 'padding-right:24px') + '"><table>';
      for (var c = col * half; c < Math.min(max, (col + 1) * half); c++)
        h += '<tr class="row2"><td>' + esc(trFood(lang, later[c])) + '</td><td class="r">' + when(later[c]) + '</td></tr>';
      h += '</table></td>';
    }
    h += '</tr></table>';
    if (later.length > max) h += '<div class="label" style="margin-top:8px">' + t(lang, 'more', { n: later.length - max }) + '</div>';
  }
  put('view-fridge', h);
}

// ---- Idle ink painting ----
// No ticking clock on the idle screen: a minute clock would redraw the e-ink 1,440 times a day
function renderIdleClock(now, L) {
  put('idleTime', weather ? Math.round(weather.current.temperature_2m) + '°' : '');
  put('idleDate', esc(L.date(now) + (weather ? ' · ' + L.wx[wxGroup(weather.current.weather_code)] : '')));
}
// Paintings uploaded from the phone (stored in the database) plus the built-in ones
function showPainting() {
  var pool = (data && data.paintings && data.paintings.length) ? data.paintings : (window.GALLERY || []);
  if (!pool.length) return;
  var pick = pool[galleryIdx % pool.length];
  if (pick.indexOf('-') < 0 || pick.indexOf('/') >= 0) { $('idle').style.backgroundImage = 'url(' + pick + ')'; return; }
  xhr('POST', HUB_CONFIG.supabaseUrl + '/rest/v1/rpc/hub_painting_get', { p_token: token, p_id: pick }, function (err, img) {
    if (!err && img) $('idle').style.backgroundImage = 'url(' + img + ')';
  });
}
function sleepToPainting() {
  idle = true; galleryIdx++; // a different painting every time the screen goes idle
  showPainting();
  $('idle').style.display = 'block';
}
function wake() {
  idle = false; lastTouch = new Date().getTime();
  $('idle').style.display = 'none';
  lastLoad = new Date().getTime();
  load();
}
function touched() { lastTouch = new Date().getTime(); }
document.addEventListener('touchstart', touched, false);
document.addEventListener('click', touched, false);

function minutesOf(hhmm) { var p = hhmm.split(':'); return +p[0] * 60 + +p[1]; }
function refreshEvery(now) {
  var m = now.getHours() * 60 + now.getMinutes(), w = HUB_CONFIG.activeWindows;
  for (var i = 0; i < w.length; i++) if (m >= minutesOf(w[i][0]) && m < minutesOf(w[i][1])) return HUB_CONFIG.activeRefreshMinutes;
  if (m >= minutesOf(w[0][1]) && m < minutesOf(w[w.length - 1][0])) return HUB_CONFIG.dayRefreshMinutes;
  return 0; // night: no fetching
}
// A black flash clears e-ink ghosting; done when each active window starts
function clearGhosting() {
  var f = document.createElement('div');
  f.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:99';
  document.body.appendChild(f);
  setTimeout(function () { document.body.removeChild(f); }, 600);
}

// Idle check every 15 s, so the painting appears close to the set time (this does not redraw anything)
setInterval(function () {
  if (!idle && new Date().getTime() - lastTouch > HUB_CONFIG.idleMinutes * 60000) sleepToPainting();
}, 15000);

var lastLoad = new Date().getTime(), lastPainting = lastLoad, lastEvery = -1;
setInterval(function () {
  var now = new Date(), ms = now.getTime(), every = refreshEvery(now);
  if (!idle && ms - lastTouch > HUB_CONFIG.idleMinutes * 60000) sleepToPainting();
  if (every === HUB_CONFIG.activeRefreshMinutes && lastEvery !== every) clearGhosting();
  lastEvery = every;
  if (every && ms - lastLoad >= every * 60000) { lastLoad = ms; load(); }
  else render(); // cheap: only redraws if the date or tab text changed
  if (idle && every && ms - lastPainting >= HUB_CONFIG.galleryMinutes * 60000) { lastPainting = ms; galleryIdx++; showPainting(); }
  if (now.getHours() === 3 && now.getMinutes() === 0) location.reload(); // once a night keeps the old browser healthy
}, 60000);

// The layout is drawn for 758px; scale it to the Kindle's real browser width
(function () {
  var w = window.innerWidth || document.documentElement.clientWidth || 758;
  var z = w / 758;
  if (z > 1.04 || z < 0.96) document.body.style.zoom = z;
})();

load();
render();
</script>
</body>
</html>
